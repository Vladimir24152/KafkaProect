server:
  port: 8084

spring:
  application:
    name: notifications

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

    consumer:
      group-id: notifications-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "org.neoflex.notifications.model"
        spring.json.value.default.type: org.neoflex.notifications.model.OrderSentEvent
        spring.json.use.type.headers: false

    listener:
      ack-mode: manual_immediate
      concurrency: ${CONSUMER_CONCURRENCY:4}

    admin:
      auto-create: true
      fail-fast: true

KAFKA_PARTITION_COUNT: ${KAFKA_PARTITION_COUNT:4}

logging:
  level:
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
    org.neoflex.notifications: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"